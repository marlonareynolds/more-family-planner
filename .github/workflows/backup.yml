name: Backup and restore rehearsal
# Daily logical backup of the live database, restored straight away into an
# isolated embedded Postgres and verified (spec section 15: RPO 24 h).
# Needs repository secrets DATABASE_URL (Supabase session pooler URL) and
# BACKUP_PASSPHRASE. Without them the job says so and stops.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Add DATABASE_URL and BACKUP_PASSPHRASE repository secrets to switch on backups."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.ready == 'true'
        name: Back up
        run: pnpm db:backup backups/more.json.gz.enc
      - if: steps.secrets.outputs.ready == 'true'
        name: Restore and verify in isolation
        run: pnpm db:rehearse backups/more.json.gz.enc --summary "$GITHUB_STEP_SUMMARY"
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: more-backup-${{ github.run_id }}
          path: backups/more.json.gz.enc
          retention-days: 14
          if-no-files-found: error
