name: Reminders and messages
# Manual only. The live schedule is Supabase cron (job "more-tick", every 5
# minutes; see docs/restore.md "Losing a key" for its secret), which uses no
# GitHub minutes. Run this by hand to nudge the app if that job is paused.
# Needs repository secrets MORE_APP_URL and CRON_SECRET (same value as Vercel).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MORE_APP_URL: ${{ secrets.MORE_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run the tick
        run: |
          if [ -z "$MORE_APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Add MORE_APP_URL and CRON_SECRET repository secrets to switch on timely reminders."
            exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "${MORE_APP_URL%/}/api/v1/cron/outbox"
